#!/bin/bash

set -e

echo "======================================"
echo " Homelab Kubernetes Auto Deploy"
echo "======================================"

NAMESPACE="homelab"

echo "[1/6] Installing ingress-nginx..."
kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml

echo "[2/6] Creating namespace..."
kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

echo "[3/6] Applying workloads..."

cat <<EOF | kubectl apply -f -

# ===================== PIHOLE =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: $NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - name: pihole
        image: pihole/pihole:latest
        ports:
        - containerPort: 80
        - containerPort: 53
          protocol: UDP
        env:
        - name: TZ
          value: Africa/Johannesburg
        - name: WEBPASSWORD
          value: admin123
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: $NAMESPACE
spec:
  type: NodePort
  selector:
    app: pihole
  ports:
  - port: 80
    nodePort: 30080

# ===================== N8N =====================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: $NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: admin
        - name: N8N_BASIC_AUTH_PASSWORD
          value: admin123
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: $NAMESPACE
spec:
  selector:
    app: n8n
  ports:
  - port: 5678
    targetPort: 5678

# ===================== QBittorrent =====================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: $NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: qbittorrent
        image: linuxserver/qbittorrent
        ports:
        - containerPort: 8080
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: Africa/Johannesburg
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: $NAMESPACE
spec:
  selector:
    app: qbittorrent
  ports:
  - port: 8080
    targetPort: 8080

# ===================== RUSTDESK =====================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk
  namespace: $NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustdesk
  template:
    metadata:
      labels:
        app: rustdesk
    spec:
      containers:
      - name: hbbs
        image: rustdesk/rustdesk-server
        args: ["hbbs"]
        ports:
        - containerPort: 21115
        - containerPort: 21116
      - name: hbbr
        image: rustdesk/rustdesk-server
        args: ["hbbr"]
        ports:
        - containerPort: 21117
---
apiVersion: v1
kind: Service
metadata:
  name: rustdesk
  namespace: $NAMESPACE
spec:
  selector:
    app: rustdesk
  ports:
  - name: hbbs
    port: 21115
  - name: hbbr
    port: 21117

EOF

echo "[4/6] Deploying Nginx Proxy Manager (optional UI proxy)..."

cat <<EOF | kubectl apply -f -

apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm
  namespace: $NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: npm
  template:
    metadata:
      labels:
        app: npm
    spec:
      containers:
      - name: npm
        image: jc21/nginx-proxy-manager:latest
        ports:
        - containerPort: 80
        - containerPort: 81
        - containerPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: npm
  namespace: $NAMESPACE
spec:
  type: NodePort
  selector:
    app: npm
  ports:
  - port: 80
    nodePort: 30081
  - port: 81
    nodePort: 30082
  - port: 443
    nodePort: 30443

EOF

echo "[5/6] Waiting for pods..."
kubectl get pods -n $NAMESPACE -w

echo "[6/6] DONE!"
echo ""
echo "Access URLs (replace with your node IP):"
echo "Pi-hole:       http://<NODE-IP>:30080"
echo "n8n:           http://<NODE-IP>:5678 (no ingress yet)"
echo "qBittorrent:   http://<NODE-IP>:8080"
echo "NPM:           http://<NODE-IP>:30082"
echo ""
echo "TIP: Next upgrade -> ingress + domains + HTTPS"
