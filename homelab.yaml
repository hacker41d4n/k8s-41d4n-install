apiVersion: v1
kind: Namespace
metadata:
  name: homelab

---
# ===================== STORAGE =====================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npm-data-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heimdall-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

---
# ===================== PI-HOLE =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - name: pihole
        image: pihole/pihole:latest
        env:
        - name: TZ
          value: "Africa/Johannesburg"
        - name: WEBPASSWORD
          value: "change-me"
        ports:
        - containerPort: 80
        - containerPort: 53
        - containerPort: 53
          protocol: UDP
        volumeMounts:
        - name: pihole-storage
          mountPath: /etc/pihole
      volumes:
      - name: pihole-storage
        persistentVolumeClaim:
          claimName: pihole-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: homelab
spec:
  selector:
    app: pihole
  ports:
  - name: web
    port: 80
    targetPort: 80
  - name: dns
    port: 53
    targetPort: 53
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  externalIPs:
  - 10.72.48.251

---
# ===================== NGINX PROXY MANAGER =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: npm
  template:
    metadata:
      labels:
        app: npm
    spec:
      containers:
      - name: npm
        image: jc21/nginx-proxy-manager:latest
        ports:
        - containerPort: 80
        - containerPort: 81
        - containerPort: 443
        volumeMounts:
        - name: npm-data
          mountPath: /data
      volumes:
      - name: npm-data
        persistentVolumeClaim:
          claimName: npm-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: npm
  namespace: homelab
spec:
  selector:
    app: npm
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: admin
    port: 81
    targetPort: 81
  - name: https
    port: 443
    targetPort: 443
  externalIPs:
  - 10.72.48.251

---
# ===================== QBITTORRENT =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Africa/Johannesburg"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: qb-config
          mountPath: /config
      volumes:
      - name: qb-config
        persistentVolumeClaim:
          claimName: qbittorrent-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: homelab
spec:
  selector:
    app: qbittorrent
  ports:
  - port: 8080
    targetPort: 8080
  externalIPs:
  - 10.72.48.251

---
# ===================== N8N =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: TZ
          value: "Africa/Johannesburg"
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: homelab
spec:
  selector:
    app: n8n
  ports:
  - port: 5678
    targetPort: 5678
  externalIPs:
  - 10.72.48.251

---
# ===================== HEIMDALL =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heimdall
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heimdall
  template:
    metadata:
      labels:
        app: heimdall
    spec:
      containers:
      - name: heimdall
        image: linuxserver/heimdall:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: heimdall-storage
          mountPath: /config
      volumes:
      - name: heimdall-storage
        persistentVolumeClaim:
          claimName: heimdall-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: heimdall
  namespace: homelab
spec:
  selector:
    app: heimdall
  ports:
  - port: 80
    targetPort: 80
  externalIPs:
  - 10.72.48.251

---
# ===================== RUSTDESK SERVER =====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustdesk
  template:
    metadata:
      labels:
        app: rustdesk
    spec:
      containers:
      - name: rustdesk
        image: rustdesk/rustdesk-server:latest
        ports:
        - containerPort: 21115
        - containerPort: 21116
        - containerPort: 21117
        - containerPort: 21118
        - containerPort: 21119
---
apiVersion: v1
kind: Service
metadata:
  name: rustdesk
  namespace: homelab
spec:
  selector:
    app: rustdesk
  ports:
  - name: hbbs
    port: 21115
  - name: hbbr
    port: 21116
  externalIPs:
  - 10.72.48.251
