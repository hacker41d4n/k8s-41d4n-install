apiVersion: v1
kind: Namespace
metadata:
  name: homelab

---

# ================= STORAGE =================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qb-config
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qb-downloads
  namespace: homelab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path

---

# ================= PI-HOLE =================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
      - name: pihole
        image: pihole/pihole:latest
        env:
        - name: TZ
          value: Africa/Johannesburg
        - name: WEBPASSWORD
          value: admin123
        ports:
        - containerPort: 80
        - containerPort: 53
          protocol: TCP
        - containerPort: 53
          protocol: UDP
        volumeMounts:
        - name: etc-pihole
          mountPath: /etc/pihole
        - name: dnsmasq
          mountPath: /etc/dnsmasq.d
      volumes:
      - name: etc-pihole
        persistentVolumeClaim:
          claimName: pihole-pvc
      - name: dnsmasq
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: homelab
spec:
  selector:
    app: pihole
  ports:
  - name: web
    port: 80
    targetPort: 80

---

# ================= N8N =================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          value: admin
        - name: N8N_BASIC_AUTH_PASSWORD
          value: admin123
        volumeMounts:
        - name: n8n-data
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: homelab
spec:
  selector:
    app: n8n
  ports:
  - port: 5678
    targetPort: 5678

---

# ================= QBITTORRENT =================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: WEBUI_PORT
          value: "8080"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qb-config
      - name: downloads
        persistentVolumeClaim:
          claimName: qb-downloads

---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: homelab
spec:
  selector:
    app: qbittorrent
  ports:
  - port: 8080
    targetPort: 8080

---

# ================= RUSTDESK SERVER =================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-hbbs
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hbbs
  template:
    metadata:
      labels:
        app: hbbs
    spec:
      containers:
      - name: hbbs
        image: rustdesk/rustdesk-server:latest
        args: ["hbbs"]
        ports:
        - containerPort: 21115
        - containerPort: 21116

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk-hbbr
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hbbr
  template:
    metadata:
      labels:
        app: hbbr
    spec:
      containers:
      - name: hbbr
        image: rustdesk/rustdesk-server:latest
        args: ["hbbr"]
        ports:
        - containerPort: 21117

---

# ================= NGINX PROXY MANAGER =================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-proxy-manager
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: npm
  template:
    metadata:
      labels:
        app: npm
    spec:
      containers:
      - name: npm
        image: jc21/nginx-proxy-manager:latest
        ports:
        - containerPort: 80
        - containerPort: 81
        - containerPort: 443

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-proxy-manager
  namespace: homelab
spec:
  selector:
    app: npm
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: admin
    port: 81
    targetPort: 81
  - name: https
    port: 443
    targetPort: 443
